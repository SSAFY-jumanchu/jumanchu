name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 동일 브랜치/PR에 대한 중복 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Backend (Django) ----------
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    # backend/ 디렉토리가 없을 때는 skip — 초기 단계 보호
    if: hashFiles('backend/**') != ''
    defaults:
      run:
        working-directory: backend
    # settings.py가 PostgreSQL·Redis를 쓰므로 테스트용 서비스 컨테이너를 띄운다
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jumanchu
          POSTGRES_USER: jumanchu
          POSTGRES_PASSWORD: jumanchu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jumanchu"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_NAME: jumanchu
      DB_USER: jumanchu
      DB_PASSWORD: jumanchu
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff

      - name: Lint (ruff, 치명적 오류만)
        # 문법 오류·미정의 이름 등 실행을 깨는 규칙만 검사한다.
        # 전체 규칙은 기존 코드에 스타일 경고가 많아 별도 정리 후 넓힌다.
        run: ruff check --select E9,F63,F7,F82 .

      - name: Django check
        run: python manage.py check

      - name: Migration check (누락된 마이그레이션 차단)
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput

  # ---------- Frontend (Vue.js) ----------
  frontend:
    name: Frontend (Vue.js)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/**') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        # TODO(SCRUM-27 이후): 첫 FE 테스트가 추가되는 PR에서 `|| true` 제거.
        run: npm test --if-present -- --run || true
