name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 동일 브랜치/PR에 대한 중복 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Backend (Django) ----------
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    # backend/ 디렉토리가 없을 때는 skip — 초기 단계 보호
    if: hashFiles('backend/**') != ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-django

      - name: Lint (ruff)
        run: ruff check .

      - name: Migration check (누락된 마이그레이션 차단)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: ci-test-secret
          DEBUG: "False"
        run: |
          if [ -f manage.py ]; then
            python manage.py makemigrations --check --dry-run
          fi

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: ci-test-secret
          DEBUG: "False"
        run: |
          if [ -f manage.py ]; then python manage.py check; fi
          # TODO(SCRUM-23 이후): 첫 테스트가 추가되는 PR에서 `|| true` 제거.
          # 그 전까지는 테스트 파일이 없을 수 있어 보호용으로 유지.
          pytest -q || true

  # ---------- Frontend (Vue.js) ----------
  frontend:
    name: Frontend (Vue.js)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/**') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        # TODO(SCRUM-27 이후): 첫 FE 테스트가 추가되는 PR에서 `|| true` 제거.
        run: npm test --if-present -- --run || true
