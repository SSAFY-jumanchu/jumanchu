<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주만추 — 와이어프레임</title>
    <!-- 손글씨 다이어리용 폰트 (네트워크 가능 시 적용) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <script>
      // 첫 페인트 전에 저장된 테마를 적용해 라이트→다크 깜빡임(FOUC)을 막는다.
      (function () {
        var saved = localStorage.getItem('jmc_theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        // 연애모드(장기연애 컨셉) — 저장값 없으면 normal(기본 주식 서비스)
        var mode = localStorage.getItem('jmc_mode') === 'dating' ? 'dating' : 'normal'
        document.documentElement.setAttribute('data-mode', mode)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
