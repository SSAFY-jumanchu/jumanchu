# =====================================================================
#  주만추 배치 스케줄링 — Docker 오버레이 (⚠️ 예시/미완성)
# =====================================================================
#  ⚠️ 전제(아직 충족 안 됨): 이 프로젝트의 docker-compose.yml 에는 현재 db·redis 만 있고
#     backend 컨테이너(앱)·Dockerfile 이 없다. 이 오버레이는 "backend 를 컨테이너로 올린
#     뒤"의 스케줄링 패턴 참고용이다. 그대로 'up' 하면 backend 이미지 빌드에서 실패한다.
#     → 먼저 backend/Dockerfile 작성 + 본 compose 의 backend 서비스 정의가 선행돼야 한다.
#     데모는 Windows 작업 스케줄러(deploy/register_batch_tasks.ps1) 또는 cron 경로를 쓸 것.
#
#  실행(전제 충족 시, 프로젝트 루트=docker-compose.yml 위치에서):
#     docker compose -f docker-compose.yml -f deploy/docker-compose.scheduler.yml up -d
#  (상대경로는 첫 -f 파일 디렉토리=프로젝트 루트 기준으로 해석됨 → ./backend = ROOT/backend)
#
#  접근: ofelia(docker-native cron) 사이드카가 backend 컨테이너에서 run_batch 를 label
#        스케줄대로 exec. warmer 는 별도 상시 서비스로 warm_volume_loop 를 돈다.
# =====================================================================

services:
  # ── 앱 컨테이너 (스텁 — 실제 Dockerfile/서비스 정의 필요) ───────────────
  backend:
    build:
      context: ./backend            # 프로젝트 루트 기준. backend/Dockerfile 필요(현재 미존재)
    image: jumanchu-backend:local
    env_file:
      - ./.env                      # Django settings 가 BASE_DIR.parent/.env 로 읽음
    environment:
      TZ: Asia/Seoul
      DB_HOST: db
      REDIS_HOST: redis
    depends_on: [db, redis]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]  # 또는 gunicorn
    labels:
      # ofelia 가 이 컨테이너 안에서 run_batch 를 exec (스케줄=6필드 cron, 맨 앞이 '초')
      ofelia.enabled: "true"
      ofelia.job-exec.daily.schedule: "0 10 18 * * 1-5"   # 평일 18:10
      ofelia.job-exec.daily.command: "python manage.py run_batch daily"
      ofelia.job-exec.weekly.schedule: "0 0 4 * * 0"      # 일 04:00
      ofelia.job-exec.weekly.command: "python manage.py run_batch weekly"
      ofelia.job-exec.hourly.schedule: "0 0 * * * *"      # 매시 정각
      ofelia.job-exec.hourly.command: "python manage.py run_batch hourly"

  # ── cron 스케줄러 사이드카 ────────────────────────────────────────────
  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    depends_on: [backend]
    environment:
      TZ: Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ── 실시간 워머 (장중 ~30초 루프) ─────────────────────────────────────
  volwarmer:
    image: jumanchu-backend:local   # backend 와 같은 이미지(먼저 빌드돼 있어야 함)
    command: ["python", "manage.py", "warm_volume_loop"]
    env_file:
      - ./.env
    environment:
      TZ: Asia/Seoul
      DB_HOST: db
      REDIS_HOST: redis
    depends_on: [db, redis]
    restart: unless-stopped         # 죽으면 자동 재시작 (warm_volume_loop 가 장중 게이트 처리)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # 로그 로테이션
